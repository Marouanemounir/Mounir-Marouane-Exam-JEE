<div class="page-container">
  <div class="form-card">
    <div class="form-header">
      <h2>Nouveau Paiement</h2>
    </div>

    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <form [formGroup]="paiementForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="contratId">ID du Contrat</label>
        <input type="number" id="contratId" formControlName="contratId" class="form-control" />
        <div *ngIf="paiementForm.get('contratId')?.invalid && paiementForm.get('contratId')?.touched" class="text-danger">
          L'ID du contrat est requis.
        </div>
      </div>

      <div class="form-group">
        <label for="date">Date de paiement</label>
        <input type="date" id="date" formControlName="date" class="form-control" />
      </div>

      <div class="form-group">
        <label for="montant">Montant (MAD)</label>
        <input type="number" id="montant" formControlName="montant" class="form-control" />
      </div>

      <div class="form-group">
        <label for="type">Type de paiement</label>
        <select id="type" formControlName="type" class="form-control">
          <option value="MENSUALITE">Mensualité</option>
          <option value="PAIEMENT_ANNUEL">Paiement Annuel</option>
          <option value="PAIEMENT_EXCEPTIONNEL">Paiement Exceptionnel</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" routerLink="/paiements">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="paiementForm.invalid || loading">
          <span *ngIf="loading" class="spinner"></span>
          <span *ngIf="!loading">Enregistrer</span>
        </button>
      </div>
    </form>
  </div>
</div>
