<div class="auth-container">
  <div class="auth-card">
    <h2>Inscription</h2>
    
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" formControlName="username" class="form-control" />
        <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="text-danger">
          Ce champ est requis.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" formControlName="password" class="form-control" />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-danger">
          Le mot de passe est requis (min. 6 caractères).
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control" />
        <div *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched" class="text-danger">
          Les mots de passe ne correspondent pas.
        </div>
      </div>

      <div class="form-group">
        <label for="role">Rôle</label>
        <select id="role" formControlName="role" class="form-control">
          <option value="ROLE_CLIENT">Client</option>
          <option value="ROLE_EMPLOYE">Employé</option>
          <option value="ROLE_ADMIN">Administrateur</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid || loading">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="!loading">S'inscrire</span>
      </button>

      <div class="mt-3 text-center">
        <a routerLink="/login">Déjà un compte ? Se connecter</a>
      </div>
    </form>
  </div>
</div>
